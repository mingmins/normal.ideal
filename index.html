<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Normal / Ideal — Type Specimen</title>

<style>
/* ───────── 기본 ───────── */
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#000}
body{font-family:"Noto Sans Mono","Courier New",monospace}
button,input,textarea{font:inherit}
button{border:0;background:transparent;color:inherit;cursor:pointer}
button:focus-visible{outline:1px dashed #555;outline-offset:5px}
[hidden]{display:none!important}

h1{
  font-size:35px;line-height:1.06;font-weight:400;letter-spacing:-2px;
  margin:0 0 10px;overflow-wrap:normal;
}
h1.long-name{font-size:35px;letter-spacing:-1.5px}

/* ───────── 홈 화면 ───────── */
.home-screen{position:fixed;inset:0;overflow:hidden;background:#fff}
.home-title{position:absolute;left:2.7%;top:7.5%;width:91%;height:78%;object-fit:contain}
.home-diagram{position:absolute;left:1.2%;top:1.5%;width:22%;max-width:330px;padding:0;z-index:2}
.home-diagram img{display:block;width:100%}

/* 홈 상태(is-home)일 때 타이핑 UI 숨김 */
body.is-home .logo,
body.is-home .categories,
body.is-home .editor,
body.is-home .selection,
body.is-home .status { display: none; }

/* ───────── 상단: 로고 / Try typing ───────── */
.logo{position:fixed;left:2vw;top:3.5vh;width:220px;padding:0}
.logo img{display:block;width:110%}
.try{position:fixed;right:4.8vw;top:2.6vh;font-size:18px;padding:0;z-index:5}

/* 홈 상태가 아닐 때(타이핑 화면일 때) Try typing 버튼 숨김 */
body:not(.is-home) .try { display: none; }

/* ───────── 좌측: 카테고리 ───────── */
.categories{position:fixed;left:45px;top:20vh;width:200px;display:grid;gap:22px}
.category{text-align:center}
.category-main{font-size:11px;line-height:1.25;padding:0;display:block;width:100%;white-space:nowrap}
.category-main span{display:block}
.category-main:hover{opacity:.55}
.marks{display:flex;justify-content:space-between;padding:0 29px;height:12px}
.mark{position:relative;width:16px;height:12px;padding:0}
.mark:after{content:'';position:absolute;left:1px;right:1px;top:5px;height:1px;background:#000}
.mark.selected:after{height:3px;top:4px}

/* ───────── 좌측 하단: 선택한 서체 ───────── */
.selection{position:fixed;left:10px;bottom:4.3vh;width:290px;text-align:center}
#style-label{font-size:18px;white-space:nowrap}
.tabs{display:flex;justify-content:center;gap:24px;margin-top:12px}

/* ───────── 하단 컨트롤 바 (사이즈, 행간) ───────── */
.bottom-controls {
  margin-top: 30px; 
  display: flex;
  flex-direction: column;
  align-items: center;    
  gap: 15px;              
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 20px;
  color: #000;
}
.bottom-controls label {
  display: flex;
  align-items: center;
  gap: 20px;
  cursor: pointer;
}
.bottom-controls input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 200px;
  height: 1px;
  background: #000;
  outline: none;
  cursor: pointer;
}
.bottom-controls input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 1px solid #000;
}

/* ───────── 타이핑 영역 ───────── */
.editor{
  position: fixed; top: 3vh; left: 300px; right: 4vw; bottom: 0vh;
  width: calc(96vw - 3px);
  border: 0; outline: 0; resize: none; 
  padding-left: 100px;
  background: transparent; color: #000;
  
  font-family: Georgia, serif;
  font-size: 190px;
  line-height: 1.18;
  overflow-wrap: anywhere;
  
  font-kerning: normal;
  font-feature-settings: "kern" 1, "liga" 1; 
  text-rendering: optimizeLegibility; 
  margin-top: 0; /* JS에서 행간 조절 시 윗줄 고정용으로 사용됨 */
}
.editor::placeholder{color:#e3e3e3}

.status{position:fixed;left:375px;bottom:27px;max-width:45vw;color:#888;font:10px Arial,sans-serif}
.status:empty{display:none}

/* ───────── 서체 연결 다이얼로그 ───────── */
dialog{width:min(820px,94vw);max-height:85vh;border:1px solid #333;padding:30px}
dialog::backdrop{background:#ffffffdb}
dialog h2{font-size:25px;font-weight:400}
dialog p{font:12px/1.8 Arial,sans-serif;color:#666}
.close{float:right;font-size:25px}
.font-group{display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid #ddd;padding:18px 0;font-size:11px}
.font-group strong{font-weight:400}
.font-upload{border:1px solid #ddd;padding:10px;line-height:1.8;min-width:0}
.font-upload span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#888}
.font-upload input{width:100%;font-size:9px;margin-top:8px}
.font-upload.loaded{border-color:#000}

/* ───────── 반응형 ───────── */
@media(min-width:1600px){
  .categories,.selection{left:2vw}
}
@media(max-height:650px) and (min-width:701px){
  .categories{top:110px;gap:14px}
  .category-main{font-size:15px}
  .selection{bottom:20px}
  h1{font-size:35px;margin-bottom:20px}
}
@media(max-width:700px){
  .logo{width:160px;left:20px;top:22px}
  .try{font-size:16px;right:20px;top:25px}
  .home-diagram{width:45%;left:4%;top:8%}
  .home-title{left:3%;width:94%;top:24%;height:60%}
  .categories{position:absolute;left:20px;right:20px;top:110px;width:auto;grid-template-columns:1fr 1fr;gap:22px 12px}
  .category-main{font-size:12px}
  .marks{padding:0 15px}
  .editor{
    left:20px;right:20px;top:280px;bottom:auto;width:calc(100% - 40px);
    height:calc(100svh - 470px);min-height:150px;font-size:75px;padding:0;
  }
  .selection{left:20px;bottom:100px;width:230px}
  h1{font-size:28px;margin-bottom:15px;letter-spacing:-1px}
  h1.long-name{font-size:28px}
  #style-label{font-size:16px}
  .bottom-controls {
    flex-direction: column;
    gap: 15px;
    width: 80%;
    bottom: 30px;
    font-size: 18px;
  }
  .bottom-controls input[type="range"] {
    width: 100%;
  }
}
</style>
</head>

<body class="is-home">

<!-- ═════════ 홈 화면 ═════════ -->
<section class="home-screen" id="home-screen" aria-label="Normal Ideal 홈">
  <img src="normal-ideal.png" class="home-title" alt="Normal Ideal background">
  <button class="home-diagram" id="home-diagram" aria-label="서체 분류 살펴보기">
    <img src="main-name.png" alt="Font Diagram">
  </button>
</section>

<!-- ═════════ 타이핑 화면 ═════════ -->
<button class="logo" id="home" aria-label="처음 화면">
  <img src="title.png" alt="Normal Ideal">
</button>
<button class="try" id="try">Try typing</button>

<nav class="categories" id="categories" aria-label="서체 카테고리"></nav>

<textarea class="editor" id="editor" aria-label="영문 소문자 타이핑" placeholder="type here" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>

<section class="selection" aria-label="선택한 서체">
  <h1 id="fontname">Font name </h1>
  <div id="style-label">Basic structure</div>
  <div class="tabs" role="tablist" aria-label="서체 스타일">
    <button role="tab" data-style="0" aria-label="Basic structure 기본 서체" title="Basic structure · 기본 서체" aria-selected="true"></button>
    <button role="tab" data-style="1" aria-label="Indigenous culture 원주민 문화" title="Indigenous culture · 원주민 문화" aria-selected="false"></button>
    <button role="tab" data-style="2" aria-label="Modern culture 현대 문화" title="Modern culture · 현대 문화" aria-selected="false"></button>
  </div>
  
  <div class="bottom-controls">
    <label>
      <input id="size" type="range" min="32" max="300" value="190" aria-label="글자 크기 조절">
    </label>
    <label>
      <input id="lineheight" type="range" min="0.5" max="3.0" step="0.05" value="1.18" aria-label="행간 조절">
    </label>
  </div>
</section>

<p class="status" id="status"></p>

<!-- ═════════ 서체 임시 교체 다이얼로그 ═════════ -->
<dialog id="settings">
  <form method="dialog"><button class="close" aria-label="닫기">×</button></form>
  <h2>Connect your typefaces</h2>
  <div id="fontrows"></div>
  <p id="uploadstatus" role="status"></p>
</dialog>

<script>
/* ═══════════════════════════════════════════
   데이터
   ═══════════════════════════════════════════ */
const labels = ['Basic structure', 'Indigenous culture', 'Modern culture'];
const titles = ['Lips', 'Tooth', 'Neck·Waist Shape', 'Facial Contouring'];
const subs   = ['Expansion & Emphasis', 'Reconstruction & Realignment', 'Distortion & Compression', 'Structural Transformation'];

const groups = [
  {name:'lips',        names:['lip shape','mursi','lip fillers']},
  {name:'teeth',       names:['tooth shape','mentawai','dental veneer']},
  {name:'neck & waist',names:['neck & waist shape','kayan','corset']},
  {name:'skull & face',names:['facial structure','mangbetu','facial contouring']},
];

const fonts = {
  'ni-file-font-0-0':'Lips-Regular.woff2',       'ni-file-font-0-1':'mursi-Regular.woff2',    'ni-file-font-0-2':'filler-Regular.woff2',
  'ni-file-font-1-0':'teeth-Regular.woff2',      'ni-file-font-1-1':'mantwai-Regular.woff2',  'ni-file-font-1-2':'laminate-Regular.woff2',
  'ni-file-font-2-0':'neck-Regular.woff2',       'ni-file-font-2-1':'kayan-Regular.woff2',    'ni-file-font-2-2':'corset-Regular.woff2',
  'ni-file-font-3-0':'headstructure-Regular.woff2','ni-file-font-3-1':'mangbetu-Regular.woff2','ni-file-font-3-2':'face-Regular.woff2',
};

/* ═══════════════════════════════════════════
   상태
   ═══════════════════════════════════════════ */
const $ = id => document.getElementById(id);
let category = 0, style = 0;
let chosen = false;
let composing = false;
let hintTimer = 0;

const key = (c = category, s = style) => `ni-file-font-${c}-${s}`;

/* ═══════════════════════════════════════════
   UI 생성
   ═══════════════════════════════════════════ */
$('categories').innerHTML = groups.map((g, c) => `
  <div class="category">
    <button class="category-main" data-category="${c}"><span>${titles[c]}</span><span>${subs[c]}</span></button>
    <div class="marks">${labels.map((label, s) =>
      `<button class="mark" data-c="${c}" data-s="${s}" title="${label}" aria-label="${titles[c]} ${label}"></button>`).join('')}
    </div>
  </div>`).join('');

$('fontrows').innerHTML = groups.map((g, c) => `
  <div class="font-group"><strong>${titles[c]}</strong>${labels.map((l, s) => `
    <label class="font-upload" id="slot-${c}-${s}">${l}<span id="filename-${c}-${s}">미연결</span>
      <input type="file" accept=".otf,.ttf,.woff,.woff2" data-c="${c}" data-s="${s}" aria-label="${g.name} ${l} 서체 연결">
    </label>`).join('')}
  </div>`).join('');

for (let c = 0; c < 4; c++) for (let s = 0; s < 3; s++) {
  $(`filename-${c}-${s}`).textContent = fonts[key(c, s)];
  $(`slot-${c}-${s}`).classList.add('loaded');
}

/* ═══════════════════════════════════════════
   화면 갱신
   ═══════════════════════════════════════════ */
function render() {
  document.querySelectorAll('[data-style]').forEach((b, i) => {
    b.setAttribute('aria-selected', i === style);
    b.tabIndex = i === style ? 0 : -1;
  });
  document.querySelectorAll('.mark').forEach(b => {
    const active = chosen && +b.dataset.c === category && +b.dataset.s === style;
    b.classList.toggle('selected', active);
    b.setAttribute('aria-pressed', active);
  });
  document.querySelectorAll('.category-main').forEach(b =>
    b.setAttribute('aria-pressed', chosen && +b.dataset.category === category));

  $('style-label').textContent = labels[style];
  $('fontname').textContent = chosen ? groups[category].names[style] : 'Font name';
  $('fontname').classList.toggle('long-name', $('fontname').textContent.length > 13);

  $('editor').style.fontFamily = fonts[key()] ? `"${key()}",Georgia,serif` : 'Georgia,serif';
}

/* ═══════════════════════════════════════════
   카테고리 / 스타일 선택
   ═══════════════════════════════════════════ */
$('categories').onclick = e => {
  const b = e.target.closest('[data-category],.mark');
  if (!b) return;
  category = +(b.dataset.category ?? b.dataset.c);
  if (b.dataset.s !== undefined) style = +b.dataset.s;
  chosen = true;
  render();
};

document.querySelectorAll('[data-style]').forEach(b => {
  b.onclick = () => { style = +b.dataset.style; chosen = true; render(); };
  b.onkeydown = e => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    style = e.key === 'Home' ? 0 : e.key === 'End' ? 2 : (style + (e.key === 'ArrowRight' ? 1 : 2)) % 3;
    chosen = true;
    render();
    document.querySelector(`[data-style="${style}"]`).focus();
  };
});

/* ═══════════════════════════════════════════
   홈 ↔ 타이핑 화면
   ═══════════════════════════════════════════ */
function showPage() {
  const typing = location.hash === '#type';
  document.body.classList.toggle('is-home', !typing);
  $('home-screen').hidden = typing;
  if (typing) { chosen = true; render(); }
}
function openTyping() {
  if (location.hash !== '#type') location.hash = 'type';
  else showPage();
}
$('try').onclick = openTyping;
$('home-diagram').onclick = openTyping;
$('home').onclick = () => { location.hash = 'home'; };
window.addEventListener('hashchange', showPage);
showPage();

/* ═══════════════════════════════════════════
   입력 정리
   ═══════════════════════════════════════════ */
const HANGUL_KEYS = {
  'ㄱ':'r','ㄲ':'r','ㄳ':'rt','ㄴ':'s','ㄵ':'sw','ㄶ':'sg','ㄷ':'e','ㄸ':'e','ㄹ':'f','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg',
  'ㅁ':'a','ㅂ':'q','ㅃ':'q','ㅄ':'qt','ㅅ':'t','ㅆ':'t','ㅇ':'d','ㅈ':'w','ㅉ':'w','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
  'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'o','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'p','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y',
  'ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l',
};
const H_LEAD  = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const H_VOWEL = [...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
const H_TAIL  = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];

function hangulToKeys(ch) {
  const code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) {
    const i = code - 0xAC00;
    return HANGUL_KEYS[H_LEAD[Math.floor(i / 588)]]
         + HANGUL_KEYS[H_VOWEL[Math.floor(i % 588 / 28)]]
         + (i % 28 ? HANGUL_KEYS[H_TAIL[i % 28]] : '');
  }
  return HANGUL_KEYS[ch] ?? ch;
}

const toKeys = s => Array.from(s, hangulToKeys).join('');
const clean  = s => toKeys(s).toLowerCase().replace(/[^a-z \n]/g, '');

function showHint(msg) {
  $('status').textContent = msg;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(render, 2500);
}

function sanitize() {
  if (composing) return;
  const el = $('editor'), raw = el.value, start = el.selectionStart, end = el.selectionEnd;
  const cleaned = clean(raw);
  el.value = cleaned;
  el.setSelectionRange(clean(raw.slice(0, start)).length, clean(raw.slice(0, end)).length);
  if (!chosen) { chosen = true; render(); }
}

$('editor').oninput = sanitize;
$('editor').oncompositionstart = () => { composing = true; };
$('editor').oncompositionend = () => { composing = false; sanitize(); };

/* ═══════════════════════════════════════════
   하단 패널 (사이즈 & 행간 조절)
   ═══════════════════════════════════════════ */
$('size').oninput = () => {
  $('editor').style.fontSize = $('size').value + 'px';
};
$('lineheight').oninput = () => {
  const lh = parseFloat($('lineheight').value);
  $('editor').style.lineHeight = lh;
  
  /* 
   * 텍스트 영역 내부에서 늘어나는 행간 여백만큼,
   * 바깥쪽 margin-top을 마이너스로 당겨서 첫 줄 시작점을 완벽하게 픽스합니다.
   * 폰트 사이즈(em)에 비례해서 알아서 작동하므로 글자 크기를 키워도 안 깨집니다!
   */
  $('editor').style.marginTop = `calc(-${(lh - 1.18) / 2}em)`;
};

/* ═══════════════════════════════════════════
   서체 임시 교체 (파일 선택 → FontFace)
   ═══════════════════════════════════════════ */
async function loadFont(c, s, name, data) {
  const id = key(c, s), face = new FontFace(id, `url(${data})`);
  await face.load();
  document.fonts.add(face);
  fonts[id] = name;
  $(`filename-${c}-${s}`).textContent = name;
  $(`slot-${c}-${s}`).classList.add('loaded');
  render();
}

$('fontrows').onchange = async e => {
  const file = e.target.files?.[0];
  if (!file) return;
  const c = +e.target.dataset.c, s = +e.target.dataset.s;
  $('uploadstatus').textContent = '서체를 불러오는 중…';
  try {
    const data = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    await loadFont(c, s, file.name, data);
    $('uploadstatus').textContent = '이번 화면에 폰트를 적용했어요. 파일을 다시 열면 프로젝트 기본 서체로 돌아옵니다.';
  } catch {
    $('uploadstatus').textContent = '파일을 읽을 수 없어요. 올바른 폰트 파일인지 확인해주세요.';
  }
};

/* ═══════════════════════════════════════════
   시작
   ═══════════════════════════════════════════ */
if (innerWidth < 701) { $('size').value = 75; $('size').oninput(); }
render();
</script>

<!-- ═════════ 내장 서체 12개 ═════════ -->
<style id="embedded-fonts">
/* 0-0 · Lips shape */
@font-face{font-family:"ni-file-font-0-0";src:url(Lips-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 0-1 · Mursi */
@font-face{font-family:"ni-file-font-0-1";src:url(mursi-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 0-2 · Lip fillers */
@font-face{font-family:"ni-file-font-0-2";src:url(filler-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 1-0 · Tooth shape */
@font-face{font-family:"ni-file-font-1-0";src:url(teeth-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 1-1 · Mentawai */
@font-face{font-family:"ni-file-font-1-1";src:url(mantwai-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 1-2 · Dental veneer */
@font-face{font-family:"ni-file-font-1-2";src:url(laminate-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 2-0 · Neck & waist */
@font-face{font-family:"ni-file-font-2-0";src:url(neck-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 2-1 · Kayan */
@font-face{font-family:"ni-file-font-2-1";src:url(kayan-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* 2-2 · Corset */
